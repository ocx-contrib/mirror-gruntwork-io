# Shared base for every spec in this repository (terragrunt, the OpenTofu /
# Terraform orchestrator published by Gruntwork).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# bin_scan, metadata, catalog, tests, versions, announce, annotations — stays
# in that package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all. This repo is single-package, so the
# measured matrix lives HERE and terragrunt/mirror.yml does not restate it,
# which removes the trap structurally.

skip_prereleases: true
cascade: true

# Bare semver versions (`1.1.2`) with no `+build` segment, so the fleet default
# applies with no exception. A cascade tag (`latest`, `1`, `1.1`) re-points on
# every re-publish; without a build segment the new manifest would reuse the
# bare version tag and orphan the prior digest for registry GC, breaking any
# `@sha256:` pin in a consumer's ocx.lock.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # These are the fleet's largest raw assets by some margin — 79–92 MB per
  # platform, uncompressed, with no archive layer, so every "bundle" is a
  # single ~85 MB file recompressed to xz. Five platforms × three versions.
  # Download/bundle widths are deliberately below the lefthook-class defaults:
  # the runner would otherwise hold ~500 MB of in-flight assets at once.
  max_downloads: 3
  max_bundles: 2
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `bin_scan` is FORCED off, not chosen. Every asset is a RAW BINARY, so it
# lands directly at the bundle content root and metadata.json's PATH is a bare
# `${installPath}` — the one layout where that is correct. The scan only
# inspects an interface-visible `${installPath}/<dir>` entry, so with no
# subdirectory to point at, `auto` and `verify` both fail spec load at exit 65
# ("bin_scan is enabled but … declares no interface-visible ${installPath}/<dir>
# PATH entry"). `off` with a hand-listed `binaries` in metadata.json is what
# that error message itself directs.
#
# The hand list is LOAD-BEARING beyond documentation: GitHub serves a raw
# release asset with mode 0644 (measured — `stat -c %a` on all four downloaded
# Linux assets returns 644, and even the .tar.gz twin carries its single member
# as `-rw-r--r--`), and `prepare` chmods 0755 exactly the names metadata.json
# DECLARES (ocx-mirror ≥ 0.5.2). An undeclared binary would ship
# non-executable, and `bin_scan: auto` cannot rescue it — the scan only reports
# candidates it finds ALREADY executable. Quoted so no YAML 1.1 reader folds
# the bare word into boolean `false`.
bin_scan: "off"

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. Both Linux arches were byte-measured at BOTH ends
# of the mirrored range (v1.1.0 and v1.1.2); all four are statically linked Go
# binaries with no PT_INTERP, no DT_NEEDED and no UPX stub. The transcript is
# recorded above terragrunt/mirror.yml's `assets:`.
#
# So both Linux keys are BARE. `+libc.glibc` would hide the package from
# Alpine; `+libc.musl` would hide it from every glibc host it in fact runs on.
#
# A bare key claims universality, so it must prove it: ubuntu (glibc) + alpine
# (musl) + fedora (a different glibc vintage). The ALPINE LEG IS THE PROOF —
# drop it and the universal claim is merely asserted.
#
# NO `containers[].setup` ANYWHERE, and that is a measured decision rather than
# an omission. Two things could have forced one and neither does:
#   • linkage — `readelf -d` reports zero DT_NEEDED on all four Linux
#     artifacts, so there is no shared library to provision.
#   • shell-outs — terragrunt is an OpenTofu/Terraform WRAPPER and its headline
#     verbs (`run`, `apply`, `plan`) exec a `tofu`/`terraform` binary that no
#     stock image ships. The smoke test therefore does not use them: it drives
#     `hcl fmt` and `find`, which terragrunt answers entirely from its own HCL
#     parser. Both were run in a NON-GIT directory with `HOME` unset on both
#     range ends and exited cleanly, so neither git nor a tofu binary nor a
#     writable HOME is reachable from the tested path. Installing a Terraform
#     toolchain into a leg would prove less, not more: a bare image plus
#     nothing is the honest claim this artifact can make.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers: &linux_containers
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20", shell: sh }
      - { image: "fedora:40", shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front. The container
    # set is the same three images, aliased rather than copied so the two
    # arches can never drift apart.
    runner: ubuntu-24.04-arm
    containers: *linux_containers
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  # ── Pass 2 (darwin) ────────────────────────────────────────────────────────
  # Kept commented in lockstep with the matching `assets:` keys in
  # terragrunt/mirror.yml. Staging `assets:` ALONE would not save runner
  # minutes: a platform with no resolvable asset self-skips per VERSION but
  # still boots a real macOS/Windows runner and reports SUCCESS having tested
  # nothing. So the platform key and its asset regex are uncommented in the
  # SAME pass.
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 —
    # GitHub's native macos-13 Intel pool is exhausted and deadlocks push.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  #
  # ── Pass 3 (windows) ───────────────────────────────────────────────────────
  # windows/amd64 only. Upstream ships NO windows/arm64 build at any in-range
  # release — see the exclusion note in terragrunt/mirror.yml.
  windows/amd64:
    runner: windows-latest
    shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
